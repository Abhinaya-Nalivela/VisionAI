services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile

    container_name: visionai-backend

    ports:
      - "8001:8001"

    volumes:
      - visionai_data:/app/data

    environment:
      - DATABASE_PATH=/app/data/visionai.db

    restart: unless-stopped


  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile

    container_name: visionai-frontend

    ports:
      - "5173:5173"

    depends_on:
      - backend

    restart: unless-stopped


volumes:
  visionai_data: